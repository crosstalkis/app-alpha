name: inspect-jwt

# Diagnostic workflow — mints a GitHub Actions OIDC JWT and dumps the full
# decoded payload to the run log. Does NOT exchange the JWT at Conjur and
# does NOT fetch any secrets. Used to discover the actual claim set GitHub
# emits — including whether `repo_property_*` claims are present and
# whether org-level sub customization is in effect.
#
# Lab-only diagnostic. JWT claims are not secrets but they are identity
# data — never copy this pattern into a production caller. Production
# workflows should never dump the JWT payload.
#
# Trigger: workflow_dispatch from Actions UI. No automatic triggers.
#
# Audience input controls the `aud` claim minted. Default matches the
# lab's Conjur authn-jwt config (`conjur/lab`) so the JWT is shaped the
# same way the real exchange uses, but no exchange is performed.

on:
  workflow_dispatch:
    inputs:
      audience:
        description: 'aud claim requested from GHA OIDC token endpoint'
        required: false
        default: 'conjur/lab'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  inspect:
    runs-on: lab-runners
    steps:
      - name: Mint OIDC JWT and decode payload
        env:
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail

          echo "::group::1. Mint GHA OIDC JWT (audience=${AUDIENCE})"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?id-token: write missing}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?runner did not set request URL}"

          jwt=$(curl -sSf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | jq -r '.value')
          if [[ -z "${jwt}" || "${jwt}" == "null" ]]; then
            echo "ERROR: OIDC endpoint returned empty/null JWT" >&2
            exit 1
          fi
          # Mask the raw JWT — even though we'll print its claims, the
          # signed token itself shouldn't appear in logs.
          echo "::add-mask::${jwt}"
          echo "JWT minted (length=${#jwt})"
          echo "::endgroup::"

          # ------------------------------------------------------------------
          # Decode payload — same base64url handling as the production
          # composite (conjur-jwt-fetch/action.yml lines ~84-93).
          # ------------------------------------------------------------------
          payload_b64="${jwt#*.}"
          payload_b64="${payload_b64%%.*}"
          b64="${payload_b64//-/+}"
          b64="${b64//_/\/}"
          pad=$(( (4 - ${#b64} % 4) % 4 ))
          b64="${b64}$(printf '%*s' "${pad}" '' | tr ' ' '=')"
          if ! payload_json=$(printf '%s' "${b64}" | base64 -d 2>/dev/null); then
            echo "ERROR: could not base64url-decode JWT payload" >&2
            exit 1
          fi

          echo "::group::2. Standard claim set (every key in the payload)"
          # Sorted list of every claim key. This is the headline result of
          # this workflow — it shows exactly what GitHub emits for this
          # repo at this point in time.
          jq -r 'keys_unsorted | sort | .[]' <<< "${payload_json}"
          echo "::endgroup::"

          echo "::group::3. repo_property_* claims (custom property channel)"
          # Filter to the documented custom-claim channel. Empty list means
          # no custom properties are set on this repo (or the property
          # exists but isn't enabled for OIDC inclusion).
          rp_count=$(jq -r '[keys[] | select(startswith("repo_property_"))] | length' <<< "${payload_json}")
          echo "repo_property_* claim count: ${rp_count}"
          if [[ "${rp_count}" -gt 0 ]]; then
            jq -r 'with_entries(select(.key | startswith("repo_property_"))) | to_entries | .[] | "  \(.key) = \(.value)"' <<< "${payload_json}"
          else
            echo "  (none — repo has no enabled custom properties)"
          fi
          echo "::endgroup::"

          echo "::group::4. sub claim format"
          # The sub claim reflects org-level sub customization
          # (set in lab by scripts/05 and scripts/09). Print verbatim.
          sub=$(jq -r '.sub' <<< "${payload_json}")
          echo "sub = ${sub}"
          echo "::endgroup::"

          echo "::group::5. Issuer + audience + lifetime"
          jq -r '"iss = \(.iss)\naud = \(.aud)\niat = \(.iat)\nexp = \(.exp)\nnbf = \(.nbf)"' <<< "${payload_json}"
          echo "::endgroup::"

          echo "::group::6. Full payload (pretty-printed)"
          # Last — full payload for the audit trail. Anything we missed in
          # the filtered groups above is here.
          jq . <<< "${payload_json}"
          echo "::endgroup::"

          # Summary line (greppable). Mirrors the CORRELATION pattern in
          # the production composite.
          jq -r '"INSPECT repository=\(.repository) repository_owner=\(.repository_owner) repository_id=\(.repository_id) run_id=\(.run_id) sub=\(.sub) repo_property_count='"${rp_count}"'"' <<< "${payload_json}"
